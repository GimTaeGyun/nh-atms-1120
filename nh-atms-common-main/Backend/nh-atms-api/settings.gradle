// 폐쇄망 대응 (nh-atms 원본 settings.gradle 과 같은 방식)
// - foojay-resolver-convention 을 쓰지 않는다: JDK 자동 다운로드(api.foojay.io)·Plugin Portal 접속이
//   --offline 이전 단계(settings 평가)에서 실패하는 문제를 막는다. JDK 21 은 로컬 설치본(gradle.properties).
// - pluginManagement: 사내 미러(Nexus)가 생기면 아래 주석 줄을 켜고 URL 을 바꾼다.
pluginManagement {
    repositories {
        // maven { url 'http://<사내Nexus>/repository/gradle-plugins/' }   // 폐쇄망 미러
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'nh-atms-api'

// 공통 라이브러리(jar) + 화면 백엔드(실행 모듈) — 이 저장소의 앱 (설계 §5.1)
include 'atms-common'
include 'atms-web'

// NH-ATMS 업무 모듈 5개 (2026-11-09 사용자 결정: 새 앱과 함께 개발서버에 배포)
//  - 2026-11-10 사용자 결정: 폐쇄망에서 사용자가 직접 추가한 구조를 따른다 — 5개 모두 이 저장소의 'atms-common' 하나를 쓴다
//    (따로 두었던 atms-common-nh 는 없앰). 5개 모듈이 쓰는데 새 공통에 없던 것은 atms-common 에 보탰다:
//    util/GlobalIdGenerator(if-external), jeus-common.yml 의 jeus.webtob-url·jeus.url.*·jeus.agent-entry.*(journal·file)
//  - 출처: 같은 저장소의 NH-ATMS/Backend/nh-atms-api (build.gradle 은 원본 그대로 project(':atms-common'))
//  - 폴더 이름 atms-<모듈> 은 배포킷 Jenkins(atms-*/build/libs/*.war)·deploy-war.sh(모듈 → 서버) 규칙 그대로
include 'atms-journal'
include 'atms-batch'
include 'atms-file'
include 'atms-if-internal'
include 'atms-if-external'
